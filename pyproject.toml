[project]
name = "shared-reality"
version = "0.1.0"
description = "Computational models and analyses for shared reality research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "statsmodels>=0.14",
    "polars>=0.20",
    "pyarrow>=14.0",
    "jax>=0.4",
    "jaxlib>=0.4",
]

[project.optional-dependencies]
llm = [
    "vertexai>=1.0",
    "google-cloud-aiplatform>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "jupyter>=1.0",
]
